name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/downloads/insus-manpower-solution.apk"
      - "public/.well-known/assetlinks.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      - name: Build and sign APK
        env:
          STORE_PASS: ${{ github.run_id }}-insus-store
          KEY_PASS: ${{ github.run_id }}-insus-key
        run: |
          set -euo pipefail
          mkdir -p public/downloads public/.well-known
          keytool -genkeypair -v \
            -keystore android/ci.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=INSUS Manpower Solution, OU=INSUS, O=VisaHOBe, C=SG"
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --no-daemon --stacktrace --console=plain)
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="/tmp/insus-aligned.apk"
          SIGNED="public/downloads/insus-manpower-solution.apk"
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks android/ci.keystore \
            --ks-key-alias android \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$SIGNED"
          FINGERPRINT=$(keytool -list -v -keystore android/ci.keystore -storepass "$STORE_PASS" -alias android | awk -F': ' '/SHA256:/{print $2; exit}')
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.insus.manpower","sha256_cert_fingerprints":["%s"]}}]\n' "$FINGERPRINT" > public/.well-known/assetlinks.json
      - name: Commit APK and asset links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/insus-manpower-solution.apk public/.well-known/assetlinks.json
          git diff --cached --quiet && exit 0
          git commit -m "build: publish signed Android APK"
          git push
