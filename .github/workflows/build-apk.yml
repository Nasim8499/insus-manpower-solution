name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/downloads/insus-manpower-solution.apk"
      - "public/.well-known/assetlinks.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build packages
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      - name: Install Bubblewrap and Expect
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect
          npm install --global @bubblewrap/cli
      - name: Generate and build signed APK
        env:
          STORE_PASS: ${{ github.run_id }}-insus-store
          KEY_PASS: ${{ github.run_id }}-insus-key
        run: |
          set -euo pipefail
          mkdir -p twa-build "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat > /tmp/init-twa.expect <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 600
          spawn bubblewrap init --manifest=https://nasim8499.github.io/insus-manpower-solution/manifest.webmanifest --directory=twa-build
          expect -re {\? Domain:} { send "\r" }
          expect -re {\? URL path:} { send "\r" }
          expect -re {\? Application name:} { send "\r" }
          expect -re {\? Short name:} { send "\r" }
          expect -re {\? Application ID:} { send "com.insus.manpower\r" }
          expect -re {\? Starting version code} { send "\r" }
          expect -re {\? Display mode:} { send "\r" }
          expect -re {\? Orientation:} { send "\r" }
          expect -re {\? Status bar color:} { send "\r" }
          expect -re {\? Splash screen color:} { send "\r" }
          expect -re {\? Icon URL:} { send "\r" }
          expect -re {\? Maskable icon URL:} { send "\r" }
          expect -re {\? Monochrome icon URL:} { send "\r" }
          expect -re {\? Include support for Play Billing\?} { send "\r" }
          expect -re {\? Request geolocation permission\?} { send "\r" }
          expect -re {\? Key store location:} { send "\r" }
          expect -re {\? Key name:} { send "\r" }
          expect -re {\? Do you want to create one now\?} { send "y\r" }
          expect -re {\? First and Last names.*:} { send "INSUS Manpower Solution\r" }
          expect -re {\? Organizational Unit.*:} { send "INSUS\r" }
          expect -re {\? Organization.*:} { send "VisaHOBe\r" }
          expect -re {\? Country.*:} { send "SG\r" }
          expect -re {\? Password for the Key Store:} { send "$env(STORE_PASS)\r" }
          expect -re {\? Password for the Key:} { send "$env(KEY_PASS)\r" }
          expect eof
          EXPECT
          expect /tmp/init-twa.expect
          (cd twa-build && BUBBLEWRAP_KEYSTORE_PASSWORD="$STORE_PASS" BUBBLEWRAP_KEY_PASSWORD="$KEY_PASS" bubblewrap build --skipPwaValidation)
          mkdir -p public/downloads public/.well-known
          cp twa-build/app-release-signed.apk public/downloads/insus-manpower-solution.apk
          FINGERPRINT=$(keytool -list -v -keystore twa-build/android.keystore -storepass "$STORE_PASS" -alias android | awk -F': ' '/SHA256:/{print $2; exit}')
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.insus.manpower","sha256_cert_fingerprints":["%s"]}}]\n' "$FINGERPRINT" > public/.well-known/assetlinks.json
      - name: Commit APK and asset links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/insus-manpower-solution.apk public/.well-known/assetlinks.json
          git diff --cached --quiet && exit 0
          git commit -m "build: publish signed Android APK"
          git push
